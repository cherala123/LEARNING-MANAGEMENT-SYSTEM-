<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Registration | EduLearn</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222b45;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .brand {
            color: #5b4bdb;
            font-weight: 800;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #5b4bdb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn.light {
            background: #eeecff;
            color: #5142ce;
        }

        .muted {
            color: #737b91;
            line-height: 1.6;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .side {
            width: 245px;
            background: #fff;
            padding: 25px 18px;
            box-shadow: 2px 0 15px #1725540a;
        }

        .side .brand {
            display: block;
            margin: 0 10px 28px;
        }

        .nav a {
            display: block;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 9px;
            color: #59617a;
        }

        .nav a:hover,
        .nav a.active {
            background: #eeecff;
            color: #5142ce;
            font-weight: 700;
        }

        .main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        .card {
            background: #fff;
            border: 1px solid #eceef5;
            border-radius: 15px;
            padding: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                3,
                minmax(0, 1fr)
            );
            gap: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(
                3,
                minmax(0, 1fr)
            );
            gap: 16px;
            margin: 24px 0;
        }

        .big {
            font-size: 30px;
            color: #5b4bdb;
            font-weight: 800;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe2ed;
            border-radius: 9px;
            font: inherit;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 7px;
        }

        .msg {
            margin-top: 12px;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #eeecff;
            color: #5142ce;
        }

        @media (max-width: 800px) {
            .layout {
                display: block;
            }

            .side {
                width: 100%;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav a {
                padding: 9px;
            }

            .main {
                padding: 18px;
            }

            .grid,
            .cards {
                grid-template-columns: 1fr;
            }
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .auth {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 15px 45px #27336a15;
        }
    </style>
</head>

<body>

    <main class="auth">

        <a class="brand" href="index.html">
            EduLearn
        </a>

        <h1>Create Account</h1>

        <p class="muted">
            Select whether you are registering as a Student or Admin.
        </p>

        <form id="form">

            <label>Register as</label>

            <select id="role">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>

            <label>Full Name</label>
            <input id="name" required>

            <label>Email</label>
            <input
                id="email"
                type="email"
                required
            >

            <label>Password</label>
            <input
                id="password"
                type="password"
                minlength="4"
                required
            >

            <label>Confirm Password</label>
            <input
                id="confirm"
                type="password"
                minlength="4"
                required
            >

            <button
                class="btn"
                style="width: 100%; margin-top: 20px;"
            >
                Create Account
            </button>

            <p
                id="msg"
                class="msg"
            ></p>

        </form>

        <p
            class="muted"
            style="text-align: center;"
        >
            Already registered?
            <a
                style="color: #5b4bdb;"
                href="login.html"
            >
                Login
            </a>
        </p>

    </main>

    <script>
        document
            .getElementById("form")
            .addEventListener("submit", function (e) {
                e.preventDefault();

                let role = document
                    .getElementById("role")
                    .value;

                let name = document
                    .getElementById("name")
                    .value
                    .trim();

                let email = document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

                let password = document
                    .getElementById("password")
                    .value;

                let confirm = document
                    .getElementById("confirm")
                    .value;

                let msg = document.getElementById("msg");

                if (password !== confirm) {
                    msg.textContent =
                        "Passwords do not match.";
                    return;
                }

                let users = JSON.parse(
                    localStorage.getItem(
                        "eduLearnUsers"
                    ) || "[]"
                );

                if (
                    users.some(function (user) {
                        return (
                            user.email.toLowerCase() ===
                            email
                        );
                    })
                ) {
                    msg.textContent =
                        "Email already registered.";
                    return;
                }

                let user = {
                    id: "u" + Date.now(),
                    name: name,
                    email: email,
                    password: password,
                    role: role,
                    createdAt:
                        new Date().toISOString()
                };

                users.push(user);

                localStorage.setItem(
                    "eduLearnUsers",
                    JSON.stringify(users)
                );

                msg.style.color = "#218653";

                msg.textContent =
                    "Registration successful. Redirecting...";

                setTimeout(function () {
                    location.href = "login.html";
                }, 800);
            });
    </script>

</body>
</html>
