<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222b45;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .brand {
            color: #5b4bdb;
            font-weight: 800;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #5b4bdb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn.light {
            background: #eeecff;
            color: #5142ce;
        }

        .muted {
            color: #737b91;
            line-height: 1.6;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .side {
            width: 245px;
            background: #fff;
            padding: 25px 18px;
            box-shadow: 2px 0 15px #1725540a;
        }

        .side .brand {
            display: block;
            margin: 0 10px 28px;
        }

        .nav a {
            display: block;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 9px;
            color: #59617a;
        }

        .nav a:hover,
        .nav a.active {
            background: #eeecff;
            color: #5142ce;
            font-weight: 700;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        /* Card */
        .card {
            background: #fff;
            border: 1px solid #eceef5;
            border-radius: 15px;
            padding: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .big {
            font-size: 30px;
            color: #5b4bdb;
            font-weight: 800;
        }

        /* Form Elements */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe2ed;
            border-radius: 9px;
            font: inherit;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 7px;
        }

        .msg {
            margin-top: 12px;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #eeecff;
            color: #5142ce;
        }

        /* Responsive Design */
        @media (max-width: 800px) {

            .layout {
                display: block;
            }

            .side {
                width: 100%;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav a {
                padding: 9px;
            }

            .main {
                padding: 18px;
            }

            .grid,
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="side">

            <a
                class="brand"
                href="dashboard.html"
            >
                EduLearn
            </a>


            <nav class="nav">

                <a href="dashboard.html">
                    Overview
                </a>

                <a
                    href="courses.html"
                    class="active"
                >
                    Explore Courses
                </a>

                <a href="my-courses.html">
                    My Courses
                </a>

                <a href="profile.html">
                    My Profile
                </a>

                <a
                    href="#"
                    onclick="logout()"
                >
                    Logout
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <!-- Back Button -->
            <a href="courses.html">
                ← Back to courses
            </a>


            <!-- Course Details -->
            <article
                class="card"
                style="max-width: 800px; margin-top: 20px;"
            >

                <!-- Category -->
                <p
                    id="cat"
                    class="muted"
                ></p>


                <!-- Course Title -->
                <h1 id="title">
                    Course
                </h1>


                <!-- Description -->
                <p
                    id="desc"
                    class="muted"
                ></p>


                <!-- Topics -->
                <h2>
                    Topics Covered
                </h2>

                <div id="topics"></div>


                <!-- Enrollment Button -->
                <button
                    id="enroll"
                    class="btn"
                >
                    Enroll
                </button>


                <!-- Message -->
                <p
                    id="msg"
                    class="muted"
                ></p>

            </article>

        </main>

    </div>


    <script>

        // Get current logged-in user
        let current = JSON.parse(
            localStorage.getItem("eduLearnCurrentUser") || "null"
        );


        // Check login
        if (!current) {

            location.href = "login.html";

        } else if (current.role !== "student") {

            location.href = "admin-dashboard.html";

        }


        // Logout
        function logout() {

            localStorage.removeItem(
                "eduLearnCurrentUser"
            );

            location.href = "login.html";
        }


        // Get course ID from URL
        let id =
            new URLSearchParams(
                location.search
            ).get("id");


        // Get all courses
        let courses = JSON.parse(
            localStorage.getItem("eduLearnCourses") || "[]"
        );


        // Find selected course
        let course = courses.find(function (item) {

            return item.id === id;

        });


        // Course not found
        if (!course) {

            document.getElementById("title").textContent =
                "Course not found";

            document.getElementById("enroll").hidden =
                true;

        }


        // Course found
        else {

            // Display category
            document.getElementById("cat").textContent =
                course.category;


            // Display title
            document.getElementById("title").textContent =
                course.title;


            // Display description
            document.getElementById("desc").textContent =
                course.description;


            // Display topics
            let topicsContainer =
                document.getElementById("topics");


            (course.topics || []).forEach(
                function (topic) {

                    let topicCard =
                        document.createElement("div");


                    topicCard.className =
                        "card";


                    topicCard.style.margin =
                        "8px 0";


                    topicCard.textContent =
                        "✓ " + topic;


                    topicsContainer.appendChild(
                        topicCard
                    );

                }
            );


            // Student enrollment LocalStorage key
            let enrollmentKey =
                "eduLearnEnrollments_" +
                current.id;


            // Get existing enrollments
            let enrollments = JSON.parse(
                localStorage.getItem(
                    enrollmentKey
                ) || "[]"
            );


            // Enrollment button
            let enrollButton =
                document.getElementById("enroll");


            // Check whether already enrolled
            if (enrollments.includes(course.id)) {

                enrollButton.textContent =
                    "Go to My Courses";


                enrollButton.onclick =
                    function () {

                        location.href =
                            "my-courses.html";

                    };

            }


            // Not enrolled
            else {

                enrollButton.onclick =
                    function () {

                        // Add course ID
                        enrollments.push(
                            course.id
                        );


                        // Save enrollment
                        localStorage.setItem(
                            enrollmentKey,
                            JSON.stringify(
                                enrollments
                            )
                        );


                        // Display success message
                        document.getElementById("msg")
                            .textContent =
                            "Enrollment successful!";


                        // Change button
                        enrollButton.textContent =
                            "Go to My Courses";


                        // Change button action
                        enrollButton.onclick =
                            function () {

                                location.href =
                                    "my-courses.html";

                            };

                    };

            }

        }

    </script>

</body>

</html>
