<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Courses</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #222b45;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .brand {
            color: #5b4bdb;
            font-weight: 800;
            font-size: 24px;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #5b4bdb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn.light {
            background: #eeecff;
            color: #5142ce;
        }

        .muted {
            color: #737b91;
            line-height: 1.6;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .side {
            width: 245px;
            background: #fff;
            padding: 25px 18px;
            box-shadow: 2px 0 15px #1725540a;
        }

        .side .brand {
            display: block;
            margin: 0 10px 28px;
        }

        .nav a {
            display: block;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: 9px;
            color: #59617a;
        }

        .nav a:hover,
        .nav a.active {
            background: #eeecff;
            color: #5142ce;
            font-weight: 700;
        }

        .main {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        .card {
            background: #fff;
            border: 1px solid #eceef5;
            border-radius: 15px;
            padding: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 17px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .big {
            font-size: 30px;
            color: #5b4bdb;
            font-weight: 800;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe2ed;
            border-radius: 9px;
            font: inherit;
        }

        label {
            display: block;
            font-weight: 700;
            margin: 14px 0 7px;
        }

        .msg {
            margin-top: 12px;
        }

        .danger {
            background: #c0392b;
        }

        .secondary {
            background: #eeecff;
            color: #5142ce;
        }

        .courseRow {
            padding: 15px 0;
            border-bottom: 1px solid #eceef5;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
        }

        @media (max-width: 800px) {
            .layout {
                display: block;
            }

            .side {
                width: 100%;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
            }

            .nav a {
                padding: 9px;
            }

            .main {
                padding: 18px;
            }

            .grid,
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="side">

            <a class="brand" href="admin-dashboard.html">
                EduLearn Admin
            </a>

            <nav class="nav">
                <a href="admin-dashboard.html">
                    Overview
                </a>

                <a href="admin-courses.html" class="active">
                    Manage Courses
                </a>

                <a href="admin-students.html">
                    Manage Students
                </a>

                <a href="#" onclick="logout()">
                    Logout
                </a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <h1>Manage Courses</h1>

            <p class="muted">
                Course CRUD: Create, Read, Update and Delete.
            </p>


            <div class="grid" style="grid-template-columns: 350px 1fr;">

                <!-- Add/Edit Course Form -->
                <section class="card">

                    <h2 id="heading">
                        Add Course
                    </h2>

                    <form id="form">

                        <input type="hidden" id="id">


                        <label for="title">
                            Course Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            required
                        >


                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            required
                        >


                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            required
                        ></textarea>


                        <label for="topics">
                            Topics (comma separated)
                        </label>

                        <input
                            type="text"
                            id="topics"
                            placeholder="HTML, CSS, JavaScript"
                        >


                        <button
                            type="submit"
                            class="btn"
                            style="margin-top: 15px;"
                        >
                            Save Course
                        </button>


                        <button
                            type="button"
                            class="btn secondary"
                            style="margin-top: 15px;"
                            onclick="resetForm()"
                        >
                            Clear
                        </button>

                    </form>

                </section>


                <!-- Course List -->
                <section class="card">

                    <h2>
                        All Courses
                    </h2>

                    <div id="list"></div>

                </section>

            </div>

        </main>

    </div>


    <script>

        // Get currently logged-in user
        let current = JSON.parse(
            localStorage.getItem("eduLearnCurrentUser") || "null"
        );


        // Check admin login
        if (!current) {

            location.href = "login.html";

        } else if (current.role !== "admin") {

            location.href = "dashboard.html";

        }


        // Logout function
        function logout() {

            localStorage.removeItem("eduLearnCurrentUser");

            location.href = "login.html";
        }


        // Get courses from LocalStorage
        function getCourses() {

            return JSON.parse(
                localStorage.getItem("eduLearnCourses") || "[]"
            );
        }


        // Save courses to LocalStorage
        function saveCourses(courses) {

            localStorage.setItem(
                "eduLearnCourses",
                JSON.stringify(courses)
            );
        }


        // Reset form
        function resetForm() {

            document.getElementById("form").reset();

            document.getElementById("id").value = "";

            document.getElementById("heading").textContent = "Add Course";
        }


        // Edit course
        function editCourse(id) {

            let courses = getCourses();

            let course = courses.find(function (item) {
                return item.id === id;
            });


            if (!course) {
                return;
            }


            document.getElementById("id").value = course.id;

            document.getElementById("title").value =
                course.title;

            document.getElementById("category").value =
                course.category;

            document.getElementById("description").value =
                course.description;

            document.getElementById("topics").value =
                (course.topics || []).join(", ");


            document.getElementById("heading").textContent =
                "Edit Course";
        }


        // Delete course
        function removeCourse(id) {

            if (confirm("Delete this course?")) {

                let courses = getCourses();

                courses = courses.filter(function (course) {
                    return course.id !== id;
                });


                saveCourses(courses);

                renderCourses();

                resetForm();
            }
        }


        // Display all courses
        function renderCourses() {

            let list = document.getElementById("list");

            list.innerHTML = "";


            let courses = getCourses();


            if (courses.length === 0) {

                list.innerHTML =
                    "<p class='muted'>No courses available.</p>";

                return;
            }


            courses.forEach(function (course) {

                let row = document.createElement("div");

                row.className = "courseRow";


                // Course information
                let info = document.createElement("div");

                let title = document.createElement("b");

                title.textContent = course.title;


                let description = document.createElement("p");

                description.className = "muted";

                description.textContent =
                    course.category +
                    " · " +
                    course.description;


                info.append(title, description);


                // Action buttons
                let actions = document.createElement("div");


                let editButton =
                    document.createElement("button");

                editButton.className =
                    "btn secondary";

                editButton.textContent =
                    "Edit";

                editButton.onclick = function () {
                    editCourse(course.id);
                };


                let deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "btn danger";

                deleteButton.textContent =
                    "Delete";

                deleteButton.onclick = function () {
                    removeCourse(course.id);
                };


                actions.append(
                    editButton,
                    deleteButton
                );


                row.append(
                    info,
                    actions
                );


                list.appendChild(row);

            });
        }


        // Add or update course
        document.getElementById("form").onsubmit =
            function (event) {

                event.preventDefault();


                let id =
                    document.getElementById("id").value;


                let course = {

                    id: id || "c" + Date.now(),

                    title:
                        document.getElementById("title")
                        .value
                        .trim(),

                    category:
                        document.getElementById("category")
                        .value
                        .trim(),

                    description:
                        document.getElementById("description")
                        .value
                        .trim(),

                    topics:
                        document.getElementById("topics")
                        .value
                        .split(",")
                        .map(function (topic) {
                            return topic.trim();
                        })
                        .filter(Boolean)
                };


                let courses = getCourses();


                // Update existing course
                if (id) {

                    courses = courses.map(function (course) {

                        if (course.id === id) {
                            return course = course;
                        }

                        return course;
                    });


                    courses = courses.map(function (oldCourse) {

                        return oldCourse.id === id
                            ? course
                            : oldCourse;
                    });


                }

                // Add new course
                else {

                    courses.push(course);
                }


                // Save
                saveCourses(courses);


                // Refresh list
                renderCourses();


                // Clear form
                resetForm();

            };


        // Load courses when page opens
        renderCourses();

    </script>

</body>

</html>
